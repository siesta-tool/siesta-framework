# Flink 1.20 + SQL Gateway for the MATCH_RECOGNIZE competitor
# (tests/vldb_eval/comp_mr.py).
#
#   docker compose -f tests/vldb_eval/docker-compose-flink.yml up -d
#   docker compose -f tests/vldb_eval/docker-compose-flink.yml stop
#
# comp_mr.py writes its source CSVs under tests/vldb_eval/results/data/<ds>/mr/,
# which is bind-mounted read-only at /opt/flink/siesta_data in every container
# (the JobManager enumerates splits, the TaskManager reads them).
#
# One TaskManager with 12 slots (parallelism 12, one per core, as the other
# systems get) and 10 GB of process memory; it runs alone on the machine.
# Queries run in STREAMING mode over the bounded CSV source (event-time
# MATCH_RECOGNIZE; see comp_mr.py for why batch mode is not used).  The
# heap (hashmap) state backend buffers the events, so managed memory, which
# only RocksDB and batch operators use, is cut to 10% in favour of the heap.

name: siesta_flink

networks:
  flink-net:
    driver: bridge

x-flink-data: &flink-data
  - ./results/data:/opt/flink/siesta_data:ro

services:

  jobmanager:
    image: flink:1.20-java17
    container_name: siesta_flink_jm
    command: jobmanager
    networks:
      - flink-net
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.rpc.port: 6123
        jobmanager.memory.process.size: 1600m
        rest.port: 8081
        rest.bind-address: 0.0.0.0
        rest.address: jobmanager
        execution.runtime-mode: STREAMING
        parallelism.default: 12
        restart-strategy.type: none
        jobstore.max-capacity: 2000
        heartbeat.timeout: 60000
    volumes: *flink-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  taskmanager:
    image: flink:1.20-java17
    container_name: siesta_flink_tm
    command: taskmanager
    # a task stuck in a huge NFA computation may ignore cancellation; after
    # task.cancellation.timeout Flink kills the TaskManager, which then restarts
    restart: unless-stopped
    networks:
      - flink-net
    depends_on:
      jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.memory.process.size: 10g
        taskmanager.memory.managed.fraction: 0.1
        taskmanager.numberOfTaskSlots: 12
        task.cancellation.timeout: 60000
        execution.runtime-mode: STREAMING
        parallelism.default: 12
    volumes: *flink-data

  sql-gateway:
    image: flink:1.20-java17
    container_name: siesta_flink_gw
    networks:
      - flink-net
    command: >
      bash -c "
        ln -sf /opt/flink/opt/flink-sql-gateway-*.jar /opt/flink/lib/ &&
        /opt/flink/bin/sql-gateway.sh start-foreground
      "
    ports:
      - "8083:8083"
    depends_on:
      jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.rpc.port: 6123
        rest.address: jobmanager
        rest.port: 8081
        sql-gateway.endpoint.rest.address: 0.0.0.0
        sql-gateway.endpoint.rest.port: 8083
        sql-gateway.session.idle-timeout: 24h
        execution.runtime-mode: STREAMING
        parallelism.default: 12
        restart-strategy.type: none
    volumes: *flink-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
