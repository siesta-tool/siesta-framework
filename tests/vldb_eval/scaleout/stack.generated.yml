# GENERATED by scaleout/cluster.py — do not edit by hand.
# Spark sizing: cores.max=18, executor.cores=1
version: "3.8"

networks:
  siesta-net:
    driver: overlay
    attachable: true

volumes:
  minio-data: {}
  spark-ivy-cache: {}

services:

  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    ports:
      - target: 9000
        published: 9000
        mode: host
      - target: 9001
        published: 9001
        mode: host
    volumes:
      - minio-data:/data
    networks:
      - siesta-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == anaconda

  spark-master:
    image: 192.168.1.10:5000/siesta/spark:4.0.1
    environment:
      - SPARK_USER=spark
      - PYSPARK_PYTHON=/usr/bin/python3.12
      - SPARK_SUBMIT_OPTS=-Dlog4j.configurationFile=/opt/spark/conf/log4j2.properties
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - '7077'
      - --webui-port
      - '8085'
    ports:
      - target: 8085
        published: 8085
        mode: host
    networks:
      - siesta-net
    deploy:
      replicas: 1
      # dnsrr so `spark-master` resolves to the task's own (bindable) overlay IP
      # — Spark's master binds to --host, which cannot be a service VIP.
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.hostname == anaconda

  spark-worker:
    image: 192.168.1.10:5000/siesta/spark:4.0.1
    environment:
      - SPARK_USER=spark
      - PYSPARK_PYTHON=/usr/bin/python3.12
      - SPARK_SUBMIT_OPTS=-Dlog4j.configurationFile=/opt/spark/conf/log4j2.properties
      - SPARK_WORKER_CORES=6
      - SPARK_WORKER_MEMORY=28G
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - '8082'
    networks:
      - siesta-net
    deploy:
      replicas: 3
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.hostname != anaconda

  siesta-api:
    image: 192.168.1.10:5000/siesta/api:latest
    hostname: siesta-api
    init: true
    working_dir: /workspace
    environment:
      - SIESTA_PROJECT_ROOT=/workspace
      - SIESTA_CONFIG=/workspace/config/siesta.scaleout.config.json
      - SIESTA_PYTHON_BIN=python3.12
      - PYSPARK_PYTHON=python3.12
      - PYSPARK_DRIVER_PYTHON=python3.12
      - HADOOP_USER_NAME=spark
      - SPARK_USER=spark
      - MPLCONFIGDIR=/tmp/matplotlib
      - SPARK_IVY_DIR=/tmp/.ivy2
      - SPARK_DRIVER_HOST=siesta-api
      - SPARK_DRIVER_PORT=7078
      - SPARK_BLOCKMANAGER_PORT=7079
      - SPARK_DRIVER_MEMORY=10g
      - SPARK_EXECUTOR_MEMORY=4g
      - SPARK_EXECUTOR_CORES=1
      - SPARK_CORES_MAX=18
      - SPARK_EXECUTOR_MEMORY_OVERHEAD=512m
      - SPARK_SHUFFLE_PARTITIONS=36
      - "PYSPARK_SUBMIT_ARGS=--conf spark.rpc.message.maxSize=1024 pyspark-shell"
    volumes:
      - /home/balaktsis/vldb/siesta-framework:/workspace
      - spark-ivy-cache:/tmp/.ivy2
    # host-mode ports so `siesta-api` resolves to the task's overlay IP (via
    # deploy.endpoint_mode: dnsrr), which Spark's driver<->executor channel needs.
    ports:
      - target: 8000
        published: 8000
        mode: host
      - target: 4040
        published: 4040
        mode: host
    networks:
      - siesta-net
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.hostname == anaconda
